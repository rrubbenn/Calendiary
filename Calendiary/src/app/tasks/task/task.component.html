<div class="task">
    <div class="task-basic" (click)="showDescription(task().id)">
        <div> {{ task().name }} </div>
        <div class="center"> {{ task().startDate }} </div>
        <div class="center"> {{ task().endDate }} </div>
        <div class="priority" [ngStyle]="{ color: getPriorityColor(task().priority) }"> {{ task().priority }} </div>
        <div class="priority" [ngStyle]="{ backgroundColor: getStatusColor(task().status) }"> {{ task().status }} </div>
        <div class="icon"> 
                <mat-icon style="color: var(--secondary);"
                (click)="$event.stopPropagation()" 
                [matMenuTriggerFor]="menu">
                    more_vert
                </mat-icon> 
        </div>
        <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="editTask( task().id )">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
            </button>
            <button mat-menu-item 
                    (click)="deleteTask( task().id )" 
                    style="color: red">
                <mat-icon style="color: red">delete</mat-icon>
                <span>Delete</span>
            </button>
        </mat-menu>

    </div>
    @if ( visibleTaskId === task().id ) {
        <app-task-description [task]="task()"></app-task-description>
    }
</div>
